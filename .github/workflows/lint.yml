#The goal of this workflow is ensure whenever someone changes the python code the linter will check is the syntax format indentation is correct or not

name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    # this step will automatically clone the code of current branch into runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7  #instead of this to clone the code we can use run: git clone http://
       #this step will install the linting tool
      - name: Install Linter
        run: pip install ruff
    
